<!doctype html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <title>Sistema de RPG - Tela Login</title>


  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400..900&family=Merienda:wght@300..900&family=Paprika&display=swap"
    rel="stylesheet" />


  <link rel="stylesheet" href="../css/login.css" />


  <script src="scripts/trocaTela.js"></script>

</head>

<body>

  <main>
    <div class="container">
      <div class="login-card">
        <h1>Entrar na conta</h1>
        <p class="subtitulo">Entre para jogar</p>

        <form id="LoginForm">
          <div class="campo">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="Digite seu email" required />
          </div>

          <div class="campo">
            <label for="senha">Senha</label>
            <input type="password" id="senha" name="senha" placeholder="Digite sua senha" required />
          </div>
          <div class="botoes">
            <button type="submit" class="btnLogin">Entrar</button>
            <button type="button" id="btnCadastrar" class="btnCadastrar">Cadastrar</button>
          </div>
        </form>
      </div>
    </div>
  </main>
  <script type="module" src="../js/login.js"></script>
</body>

</html>
