<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Sistema de RPG - Tela Cadastro</title>


    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400..900&family=Merienda:wght@300..900&family=Paprika&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="../css/cadastro.css">
</head>
    <header>
        
    </header>
<body>
    <div class="container">
        <div class="cadastro-card">
            <h1>Criar conta</h1>

            <p class="subtitulo">Entre para o mundo RPG</p>

            <form id="CadastroForm">
                <div class="campo">
                    <label for="nome">Nome</label>
                    <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required>
                </div>

                <div class="campo">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Digite seu email" required>
                </div>

                <div class="campo">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" name="senha" placeholder="Digite sua senha" required>
                </div>

                <button type="submit" class="btn-cadastrar">Criar conta</button>
            </form>
        </div>
        </header>
        <script type="module" src="../js/cadastro.js"></script>
</body>

</html>
